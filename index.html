<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>railTrail</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0b1c2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="hud">
    <div class="controls">
      <button class="btn" data-action="back-title">タイトルへ</button>
      <button class="btn" data-action="reset-view">全体表示</button>
      <button class="btn" data-action="toggle-2d">2Dモード</button>
      <button class="btn" data-action="toggle-traffic">交通表示</button>
      <button class="btn" data-action="toggle-names">都市名</button>
    </div>
    <div class="controls">
      <button class="btn" data-action="toggle-civ">文明度</button>
      <button class="btn" data-action="toggle-roads">道路</button>
      <button class="btn" data-action="city-list">都市一覧</button>
      <button class="btn" data-action="story-timeline">王命履歴</button>
      <button class="btn" data-action="select-capital">首都選定</button>
      <button class="btn" data-action="develop">開拓</button>
    </div>
    <div class="controls">
      <button class="btn" data-action="save-world">保存</button>
      <button class="btn" data-action="load-world">読み込み</button>
      <button class="btn" data-action="nation-overview">国家情報</button>
    </div>
    <div class="controls">
      <button class="btn" data-action="time-stop">停止</button>
      <button class="btn" data-action="time-1x">1x</button>
      <button class="btn" data-action="time-2x">2x</button>
      <button class="btn" data-action="time-3x">3x</button>
    </div>
    <div id="hud-stats" style="padding:8px 4px; border-top:1px solid #2a2f3a; margin-top:4px; font-weight:bold; color:#ffd700;"></div>
    <div style="font-size:12px; opacity:.85;">
      ドラッグでパン / ホイールでズーム / ボタンで表示項目を切り替えできます
    </div>
    <div id="tile-info">タイルをクリックすると情報が表示されます</div>
  </div>

  <div id="title-ui">
    <h1>railTrail</h1>
    <p>新しい世界を生成するか、セーブデータをロードしてください</p>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button id="btn-new-world" class="btn large">新しい世界を生成</button>
      <button id="btn-load-world" class="btn large">JSONをファイル選択</button>
      <button id="btn-bgm-toggle" class="btn large">BGM 再生</button>
      <button id="btn-story-mode" class="btn large">ストーリーモード</button>
      <button id="btn-gallery" class="btn large">ギャラリー</button>
    </div>
    <div id="title-status"></div>
  </div>

  <div id="confirm-overlay">
    <div class="panel">
      <p>保存されている未保存の変更があります。保存しますか？</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="btn-overlay-save" class="btn">保存してタイトルへ</button>
        <button id="btn-overlay-discard" class="btn">保存せず戻る</button>
        <button id="btn-overlay-cancel" class="btn">キャンセル</button>
      </div>
    </div>
  </div>
 
  <div id="city-list-overlay">
    <div class="panel">
      <div class="panel-header">
        <h3>都市一覧</h3>
        <button id="btn-city-list-close" class="btn">閉じる</button>
      </div>
      <div id="city-list-container"></div>
    </div>
  </div>

  <div id="game-over-overlay" style="display:none; position:fixed; inset:0; background:rgba(20,0,0,0.85); z-index:100; flex-direction:column; align-items:center; justify-content:center; color:#ff8888;">
    <h1 style="font-size:48px; margin:0 0 20px; text-transform:uppercase; letter-spacing:0.1em; text-shadow:0 0 20px rgba(255,0,0,0.5);">Game Over</h1>
    <p style="font-size:18px; margin:0 0 30px; opacity:0.9;">賢が尽き、インフラを維持できなくなりました...</p>
    <div style="display:flex; gap:16px;">
      <button id="btn-go-title" class="btn large">タイトルへ戻る</button>
      <button id="btn-go-load" class="btn large">JSONを読み込む</button>
    </div>
  </div>

  <div id="wrap"><canvas id="c" width="1200" height="740"></canvas></div>
  <audio id="title-bgm" loop preload="auto"></audio>
  <div id="story-overlay-root"></div>
  <script src="main.js" defer></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
  </script>
</body>
</html>
